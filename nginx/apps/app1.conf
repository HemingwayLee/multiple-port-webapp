# app1: frontend on app1-frontend:5101, backend on app1-backend:8101.
location = /app1 {
    return 301 /app1/;
}

# API: strip the /app1 prefix, so the backend sees /api/...
location /app1/api/ {
    set $upstream http://app1-backend:8101;
    rewrite ^/app1(/.*)$ $1 break;
    proxy_pass $upstream;
    # Let streamed responses (SSE) through as they are produced.
    proxy_buffering off;
}

# Everything else (pages, assets, HMR websocket): Vite serves under its base path /app1/, so pass it as is.
location /app1/ {
    set $upstream http://app1-frontend:5101;
    proxy_pass $upstream;
}
